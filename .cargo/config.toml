# Repository-wide cargo settings for the HOST workspace.
#
# Deliberately no `[build] target` here: the firmware sets its own target in
# crates/firmware/.cargo/config.toml, and cargo discovers config from the
# current directory upwards, so a target set here would follow you into the
# firmware build and fight with it.

# The CLAUDE.md rule checker is not a cargo target: run it with
# `python3 .github/scripts/check_rules.py`.
