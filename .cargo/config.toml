#
# Cargo configuration — RISC-V (Hazard3) only, RP2350.
#

[alias]
# `cargo rrr --bin ws2812` — release build, flash, run.
rrr = "run --release --target=riscv32imac-unknown-none-elf"

[build]
# Default target, so --target can be omitted on every command.
target = "riscv32imac-unknown-none-elf"

# Soft-float ABI. Hazard3 has no FPU, so float arguments use integer registers.
[target.riscv32imac-unknown-none-elf]
# * --nmagic turns off page alignment of sections (saves flash)
# * -Trp235x_riscv.x is the RP2350 RISC-V linker script; it pulls in riscv-rt's
#   link.x itself (the reverse of how the Cortex-M side works)
# * -Tdefmt.x is required for defmt_rtt — drop this line if you remove defmt
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Trp235x_riscv.x",
]

runner = "./flash.sh"