# Host-side workspace: the shared protocol crate and the PIO USB crate.
#
# `crates/firmware` is deliberately NOT a member. It is its own workspace with
# its own `.cargo/config.toml`, because it builds for riscv32imac-unknown-none-elf
# with a custom linker script. Keeping the two apart means plain `cargo test`
# works here and plain `cargo build --release` works in there, with no
# `--target` juggling and no chance of accidentally building the firmware for
# the host.
#
#   host:     cargo test                       (from this directory)
#   firmware: cd crates/firmware && cargo build --release

[workspace]
resolver = "3"
members = ["crates/protocol", "crates/pio-usb"]
exclude = ["crates/firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
txcourier-protocol = { path = "crates/protocol" }
txcourier-pio-usb = { path = "crates/pio-usb" }
