[package]
name = "txcourier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side CLI for the RP2350 air-gapped transaction courier"

[dependencies]
txcourier-protocol.workspace = true
libc = "0.2"
thiserror = { version = "2.0.20", default-features = false }
inquire = "0.9.4"
alloy = { version = "2.5.0", default-features = false, features = ["std", "provider-http", "reqwest-native-tls"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }
