#
# Cargo configuration — RISC-V (Hazard3) only, RP2350.
#

[build]
# Default target, so --target can be omitted on every command. This only
# applies to the firmware workspace; the CLI at the repository root builds for
# the host as usual.
target = "riscv32imac-unknown-none-elf"

# Soft-float ABI. Hazard3 has no FPU, so float arguments use integer registers.
[target.riscv32imac-unknown-none-elf]
# * --nmagic turns off page alignment of sections (saves flash)
# * -Tmemory.x is our memory map and the RP2350 boot blocks; it must come first
#   so its region aliases exist before riscv-rt's -Tlink.x uses them
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tlink.x",
]

# `cargo run --release` flashes. flash.sh lives at the repository root; cargo
# invokes the runner with this directory as the working directory.
runner = "../../flash.sh"
